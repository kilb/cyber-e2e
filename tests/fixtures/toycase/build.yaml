lock_id: toycase-synthetic-selftest-build
# build-essential (not bare gcc) so a CLEAN container has the libc headers too;
# host mode treats these as a precondition (the host already has a toolchain).
system_packages: [bash, build-essential]
environment:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
locale: C.UTF-8
timezone: UTC
network_policy: deny
network_allowlist: []
recipe:
  configure: []
  build:
    - sh build.sh
  public_tests:
    - sh run_tests.sh
artifact_paths:
  - .rrg-build/bin/prog
